# App + external RDS — no bundled Postgres.
# Usage:
#   export DATABASE_URL='postgresql+psycopg://user:pass@your-rds-host:5432/re_rtc'
#   docker compose -f docker-compose.app-only.yml up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: re-rtc-backend:latest
    container_name: re-rtc-backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - backend/.env
    environment:
      - PORT=8000
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - DEV_RELOAD=false
      - SERVE_FRONTEND=false
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL to your RDS connection string}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-change-me-to-a-long-random-secret}
      - ADMIN_TOKEN_EXPIRE_HOURS=${ADMIN_TOKEN_EXPIRE_HOURS:-12}
    volumes:
      - ./backend/data:/app/data:ro
      - ./backend/assets:/app/assets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: re-rtc-frontend:latest
    container_name: re-rtc-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:80"
    environment:
      BACKEND_UPSTREAM: http://backend:8000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
