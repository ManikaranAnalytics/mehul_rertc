# Frontend — run from frontend/ directory.
# Uses backend/.env for FRONTEND_PORT (default 8012).
#
#   docker compose --env-file ../backend/.env up -d --build
#     → UI at http://localhost:8012 (proxies /api to backend)

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: re-rtc-frontend:latest
    container_name: re-rtc-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8012}:80"
    env_file:
      - ../backend/.env
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://host.docker.internal:9000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
