# Standalone backend — run from backend/ directory.
#
#   docker compose --env-file .env up -d --build
#     → API at http://localhost:8000 (uses DATABASE_URL from .env; for host Postgres
#       on Mac use @host.docker.internal in DATABASE_URL)
#
#   DB_HOST=postgres docker compose --env-file .env --profile db up -d --build
#     → API + bundled Postgres container

services:
  postgres:
    profiles: ["db"]
    image: postgres:16-alpine
    container_name: re-rtc-postgres-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-re_rtc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-re_rtc_secret}
      POSTGRES_DB: ${POSTGRES_DB:-re_rtc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-re_rtc} -d ${POSTGRES_DB:-re_rtc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: re-rtc-backend:latest
    container_name: re-rtc-backend-local
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DEV_RELOAD: "false"
      SERVE_FRONTEND: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-re_rtc}:${POSTGRES_PASSWORD:-re_rtc_secret}@${DB_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-re_rtc}}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-12345}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-me-to-a-long-random-secret}
      ADMIN_TOKEN_EXPIRE_HOURS: ${ADMIN_TOKEN_EXPIRE_HOURS:-12}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
