# Backend only — serves API + React SPA on one port (no nginx).
# Build context is repo root (bundles frontend/dist into the image).
#
#   docker compose --env-file .env up -d --build
#     → http://<host>:8012  (UI + /api)
#
# Optional local Postgres (dev only):
#   docker compose --env-file .env --profile db up -d --build

services:
  postgres:
    profiles: ["db"]
    image: postgres:16-alpine
    container_name: re-rtc-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-re_rtc}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-re_rtc_secret}
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-re_rtc}
    ports:
      - "${LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_POSTGRES_USER:-re_rtc} -d ${LOCAL_POSTGRES_DB:-re_rtc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: re-rtc-backend:latest
    container_name: re-rtc-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${PORT:-8012}:${PORT:-8012}"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8012}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DEV_RELOAD: "false"
      SERVE_FRONTEND: "true"
      FRONTEND_DIST: /app/frontend/dist
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-me-to-a-long-random-secret}
      ADMIN_TOKEN_EXPIRE_HOURS: ${ADMIN_TOKEN_EXPIRE_HOURS:-12}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(f'http://localhost:{os.getenv(\"PORT\",\"8012\")}/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
